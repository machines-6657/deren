# Every [lighting] value here is out of the range the IBL precompute supports. The CPU bake runs
# straight after load_settings() and before anything validates, so these must be clamped or the
# process reads out of bounds / dies with a length_error. See app_config::load_settings.
[lighting]
env_size = 0
env_mip_count = 1
irr_size = -4
lut_size = 999999
# environment_intensity is a multiplier on the loaded HDR, so anything below 0 (or a NaN, which is what
# a bad arithmetic expression in a hand-written config produces) must fall back rather than scale the
# environment by a negative number - a negative IBL is not a dimmer, it is a sign flip on every texel.
environment_intensity = -1.0
# area_light_*: a negative size/power means "no such emitter" rather than a negative one, a negative
# multiplier is a light that sucks photons out of the frame, and `nan` is what a hand-written arithmetic
# expression produces - all four must fall back (0 / 0 / 1 / 0) instead of reaching the light UBO and then
# every pixel, and the fallback must not take the rest of the block down with it.
area_light_size = -30.0
area_light_power = -4000.0
area_light_intensity = nan
area_light_softness = -1.0

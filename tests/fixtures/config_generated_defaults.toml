# ============================================================
# deren startup configuration (generated by
#   scripts/make_config.py)
# ============================================================

# ---- top level: model to load ----
model = "gltf_model/DamagedHelmet.gltf"

grid_side = 0
sun_intensity = 1.0

# ---- [paths] resource directories (empty = auto-locate) ----
[paths]
shaders_dir = ""
model_dir = ""

# ---- [render] window / presentation ----
[render]
window_width = 1080
window_height = 960
window_title = "deren"
vsync = false
max_fps = 0
clear_color = [0.02, 0.02, 0.03]
camera_fit = "exterior"
shadow = true
validation_layers = true

# ---- [render] shadow mapping ----
shadow_cascades = 3
shadow_map_size = 2048
shadow_cascade_blend = 0.1
toon_shadow_softness = 0

# ---- [render] shading + post-processing features ----
unlit = false
taa = false
taa_blend_static = 0.9
taa_blend_min = 0.5
fxaa = false
render_scale = 1.0
upscale = "easu"
gbuffer_debug = false
gbuffer_channel = 1
gpu_timings = true

# ---- [render] punctual lights + screen-space AO ----
clustered_lights = true
ssao = true
ssao_radius = 0.5
ssao_intensity = 1.0
ssao_samples = 8

# camera_pose = [yaw_deg, pitch_deg, distance, tx, ty, tz]   # a PINNED initial pose; absent
#   leaves camera_fit in charge. F12 and exit print one (`camera pose: ...`) to paste back.
# ---- [render] ray-traced effects ----
rt_shadows = false
rt_mask_bake = false
rt_skin_bake = false
animation_time = -1.0
furnace = false

# ---- [gui] debug overlay ----
[gui]
show = true
panel_width = 380
panel_height = 140

# ---- [lighting] IBL precompute resolutions ----
[lighting]
env_size = 256
env_mip_count = 5
irr_size = 32
lut_size = 256
environment_hdr = ""
environment_intensity = 0.35
area_light_size = 0.0
area_light_power = 0.0
area_light_position = [0.0, 0.0, 0.0]
area_light_target = [0.0, 0.0, 0.0]
area_light_intensity = 1.0
area_light_irradiance = true
area_light_shadow = true
area_light_softness = 0.0
